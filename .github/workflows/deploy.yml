name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dsc.rodrigor.com
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE
          script: |
            set -eo pipefail
            # Escreve credenciais diretamente no config.json (ignora credential helper)
            mkdir -p ~/.docker
            printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
              "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w 0)" \
              > ~/.docker/config.json
            # Pull direto da imagem (sem depender do docker compose para autenticar)
            docker pull "$APP_IMAGE"
            cd ~/projeto-eq23
            # Atualiza APP_IMAGE no .env do servidor
            grep -v '^APP_IMAGE=' .env > .env.tmp 2>/dev/null || true
            echo "APP_IMAGE=$APP_IMAGE" >> .env.tmp
            mv .env.tmp .env
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps --force-recreate app
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          APP_IMAGE: ${{ env.IMAGE }}
