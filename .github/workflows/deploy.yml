name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Configura chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan dsc.rodrigor.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Transfere imagem e faz deploy (sem autenticacao no servidor)
        run: |
          # Envia a imagem diretamente via pipe SSH — sem precisar de login no GHCR no servidor
          docker save "${{ env.IMAGE }}" | gzip | \
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
              "
              set -e
              echo 'Carregando imagem Docker...'
              docker load
              echo 'Imagem carregada! Atualizando .env...'
              cd ~/projeto-eq23
              grep -v '^APP_IMAGE=' .env > .env.tmp 2>/dev/null || true
              echo 'APP_IMAGE=${{ env.IMAGE }}' >> .env.tmp
              mv .env.tmp .env
              echo 'Subindo container...'
              docker compose -f docker/docker-compose.prod.yml up -d --no-deps --force-recreate app
              docker image prune -f
              echo 'Deploy concluido com sucesso!'
              "
