name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dsc.rodrigor.com
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE
          script: |
            set -e
            # Autentica no GitHub Container Registry
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/projeto-eq23
            # Atualiza APP_IMAGE no .env do servidor
            grep -v '^APP_IMAGE=' .env > .env.tmp 2>/dev/null || true
            echo "APP_IMAGE=$APP_IMAGE" >> .env.tmp
            mv .env.tmp .env
            docker compose -f docker/docker-compose.prod.yml pull app
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps --force-recreate app
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}
