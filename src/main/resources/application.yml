spring:
  application:
    name: mercado
  profiles:
    active: dev
  ai:
    mcp:
      server:
        # Servidor MCP: expõe operações de chamados/ativos como tools pra um assistente de IA
        # (ver MCP-IDEIA.md / MCP-TUTORIAL.md e ChamadoMcpTools). Endpoints ficam sob /mcp/**,
        # autenticados por chave de serviço (propriedade mcp.api-key abaixo), não por login de usuário.
        name: sparktech-chamados-mcp
        version: 1.0.0
        type: SYNC
    # LiteLLM (proxy multi-provedor fornecido pela disciplina) fala o dialeto da API da OpenAI,
    # então usamos o client OpenAI do Spring AI apontado pra ele em vez de um provedor direto —
    # trocar de modelo/provedor no futuro é só mudar essas variáveis, sem mexer em código.
    openai:
      base-url: ${LITELLM_BASE_URL:https://api.openai.com}
      api-key: ${LITELLM_API_KEY:dummy-key}
      chat:
        options:
          model: ${LITELLM_MODEL:gpt-4o-mini}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              # openid é obrigatório para o login ser tratado como OIDC (fluxo que
              # passa pelo CustomOidcUserService). Sem ele, o Spring Security cai no
              # fluxo de OAuth2 genérico, ignora o CustomOidcUserService e usa o "sub"
              # (ID numérico do Google) como nome de exibição — e também pula a
              # restrição de domínio @dcx.ufpb.br feita naquele serviço.
              - openid
              - email
              - profile

# Chave de serviço que um cliente MCP deve enviar como "Authorization: Bearer <chave>"
# para poder chamar as tools em /mcp/**. Sem essa variável de ambiente definida, o valor
# fica vazio e o McpApiKeyAuthFilter nega qualquer chamada (fail-closed).
mcp:
  api-key: ${MCP_API_KEY:}

# Actuator - monitoramento da aplicação
# Acesse: http://localhost:8080/actuator/health
management:
  endpoints:
    web:
      exposure:
        # Expõe apenas os endpoints necessários (não exponha todos em produção!)
        include: health,info,metrics
  endpoint:
    health:
      # Detalhes do health só são exibidos para usuários autenticados
      show-details: when-authorized

# Configurações do Umami Analytics
umami:
  script-url: ${UMAMI_SCRIPT_URL:https://umami.dsc.rodrigor.com/script.js}
  website-id: ${UMAMI_WEBSITE_ID:}




