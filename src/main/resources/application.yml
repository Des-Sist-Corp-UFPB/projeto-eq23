spring:
  application:
    name: mercado
  profiles:
    active: dev

# Actuator - monitoramento da aplicação
# Acesse: http://localhost:8080/actuator/health
management:
  endpoints:
    web:
      exposure:
        # Expõe apenas os endpoints necessários (não exponha todos em produção!)
        include: health,info,metrics
  endpoint:
    health:
      # Detalhes do health só são exibidos para usuários autenticados
      show-details: when-authorized

# Configurações do Object Storage (MinIO / S3)
aws:
  s3:
    endpoint: http://minio:9000
    public-endpoint: https://s3.dsc.rodrigor.com
    region: us-east-1
    bucket: eq23
    access-key: eq23
    secret-key: ${MINIO_SECRET}

