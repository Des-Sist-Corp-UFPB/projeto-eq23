<!DOCTYPE html>
<!--
  Página de listagem de categorias.
  Mesma estrutura da lista.html de produtos.
-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Categorias</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Categorias</h1>
            <p class="text-muted mb-0">Organize os produtos por categoria</p>
        </div>
        <button class="btn btn-primary"
                hx-get="/categorias/novo"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                hx-indicator="#spinner-cat">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
            </svg>
            Nova Categoria
            <span id="spinner-cat" class="spinner-border spinner-border-sm htmx-indicator ms-1"
                  role="status" aria-hidden="true"></span>
        </button>
    </div>

    <!-- Card com a tabela -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" style="width: 5%">#</th>
                            <th scope="col" style="width: 30%">Nome</th>
                            <th scope="col" style="width: 50%">Descrição</th>
                            <th scope="col" style="width: 15%" class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-categorias">

                        <th:block th:each="categoria : ${categorias}"
                                  th:insert="~{categorias/fragments/linha :: linha(categoria=${categoria})}">
                        </th:block>

                        <tr th:if="${categorias == null or categorias.empty}">
                            <td colspan="4" class="text-center text-muted py-5">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                                     fill="currentColor" class="bi bi-tags d-block mx-auto mb-2 text-secondary"
                                     viewBox="0 0 16 16">
                                    <path d="M3 2v4.586l7 7L14.586 9l-7-7zm2 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                                    <path d="M1.293 7.793A1 1 0 0 1 1 7.086V2a1 1 0 0 1 1-1h5.086a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0z"/>
                                </svg>
                                Nenhuma categoria cadastrada.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

</body>
</html>
