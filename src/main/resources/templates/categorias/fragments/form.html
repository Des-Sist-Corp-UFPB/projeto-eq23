<!DOCTYPE html>
<!--
  Fragmento do formulário de criação/edição de categoria em modal Bootstrap.

  - categoria == null  → modo CRIAÇÃO  (POST /categorias)
  - categoria != null  → modo EDIÇÃO   (PUT /categorias/{id})
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modal">

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="produtoModal" tabindex="-1"
         aria-labelledby="categoriaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Cabeçalho do modal -->
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="categoriaModalLabel">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                             class="bi bi-tags me-2" viewBox="0 0 16 16">
                            <path d="M3 2v4.586l7 7L14.586 9l-7-7zm2 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                            <path d="M1.293 7.793A1 1 0 0 1 1 7.086V2a1 1 0 0 1 1-1h5.086a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0z"/>
                        </svg>
                        <span th:text="${categoria == null} ? 'Nova Categoria' : 'Editar Categoria'">
                            Categoria
                        </span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <!-- Formulário com atributos HTMX dinâmicos -->
                <form th:object="${form}"
                      th:attr="
                        hx-post=${categoria == null ? '/categorias' : null},
                        hx-put=${categoria != null ? '/categorias/' + categoria.id : null},
                        hx-target=${categoria == null ? '#lista-categorias' : '#categoria-' + categoria.id},
                        hx-swap=${categoria == null ? 'beforeend' : 'outerHTML'}"
                      hx-on--after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('produtoModal')).hide(); }">

                    <div class="modal-body">

                        <!-- Alertas de erro global -->
                        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Erro</li>
                            </ul>
                        </div>

                        <!-- Campo Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">
                                Nome <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   th:field="*{nome}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   placeholder="Ex.: Hortifruti, Laticínios, Bebidas"
                                   maxlength="80"
                                   required/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nome')}"
                                 th:errors="*{nome}">
                                Erro no nome
                            </div>
                            <div class="form-text">Entre 2 e 80 caracteres. Deve ser único.</div>
                        </div>

                        <!-- Campo Descrição -->
                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">Descrição</label>
                            <textarea th:field="*{descricao}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                      rows="3"
                                      placeholder="Descrição opcional da categoria..."
                                      maxlength="500"></textarea>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('descricao')}"
                                 th:errors="*{descricao}">
                                Erro na descrição
                            </div>
                            <div class="form-text">Opcional. Máximo de 500 caracteres.</div>
                        </div>

                    </div><!-- /modal-body -->

                    <!-- Rodapé do modal -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" class="bi bi-check-lg me-1" viewBox="0 0 16 16">
                                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
                            </svg>
                            <span th:text="${categoria == null} ? 'Salvar Categoria' : 'Atualizar Categoria'">
                                Salvar
                            </span>
                            <span class="spinner-border spinner-border-sm htmx-indicator ms-1"
                                  role="status" aria-hidden="true"></span>
                        </button>
                    </div>

                </form>

            </div><!-- /modal-content -->
        </div><!-- /modal-dialog -->
    </div><!-- /modal -->

</th:block>

</body>
</html>
