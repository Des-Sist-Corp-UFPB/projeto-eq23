<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Dashboard</title>
</head>
<body>

<main>

    <div class="mb-4">
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="text-muted mb-0">Visão geral do inventário de ativos e chamados de suporte</p>
    </div>

    <!-- Cards de estatísticas -->
    <div class="row g-4 mb-5">

        <!-- Card: Total de Ativos -->
        <div class="col-md-4">
            <a th:href="@{/ativos}" class="text-decoration-none">
                <div class="card h-100 card-dashboard">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="icon-box bg-gradient-primary text-white rounded-3 p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                 class="bi bi-box-seam" viewBox="0 0 16 16">
                                <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-muted small mb-0">Total de Ativos</p>
                            <h2 class="h4 mb-0 fw-bold" th:text="${totalProdutos}">0</h2>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Card: Total de Categorias -->
        <div class="col-md-4">
            <a th:href="@{/categorias}" class="text-decoration-none">
                <div class="card h-100 card-dashboard">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="icon-box bg-gradient-info text-white rounded-3 p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                 class="bi bi-tags" viewBox="0 0 16 16">
                                <path d="M3 2v4.586l7 7L14.586 9l-7-7zm2 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                                <path d="M1.293 7.793A1 1 0 0 1 1 7.086V2a1 1 0 0 1 1-1h5.086a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-muted small mb-0">Categorias</p>
                            <h2 class="h4 mb-0 fw-bold" th:text="${totalCategorias}">0</h2>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Card: Chamados Abertos -->
        <div class="col-md-4">
            <a th:href="@{/chamados}" class="text-decoration-none">
                <div class="card h-100 card-dashboard"
                     th:classappend="${totalChamadosAbertos > 0} ? 'border-warning'">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="icon-box rounded-3 p-3"
                             th:classappend="${totalChamadosAbertos > 0} ? 'bg-gradient-danger text-white' : 'bg-gradient-success text-white'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                 class="bi bi-ticket-detailed" viewBox="0 0 16 16">
                                <path d="M4 5.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Z"/>
                                <path d="M0 4.5A1.5 1.5 0 0 1 1.5 3h13A1.5 1.5 0 0 1 16 4.5V6a.5.5 0 0 1-.5.5 1.5 1.5 0 0 0 0 3 .5.5 0 0 1 .5.5v1.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 11.5V10a.5.5 0 0 1 .5-.5 1.5 1.5 0 0 0 0-3A.5.5 0 0 1 0 6V4.5ZM1.5 4a.5.5 0 0 0-.5.5v1.05a2.5 2.5 0 0 1 0 4.9v1.05a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-1.05a2.5 2.5 0 0 1 0-4.9V4.5a.5.5 0 0 0-.5-.5h-13Z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-muted small mb-0">Chamados Abertos</p>
                            <h2 class="h4 mb-0 fw-bold"
                                th:classappend="${totalChamadosAbertos > 0} ? 'text-danger'"
                                th:text="${totalChamadosAbertos}">0</h2>
                        </div>
                    </div>
                </div>
            </a>
        </div>

    </div>

    <!-- Atalhos rápidos -->
    <div class="row g-3">
        <div class="col-12">
            <h2 class="h5 text-muted mb-3">Atalhos Rápidos</h2>
        </div>
        <div class="col-sm-6 col-md-4">
            <a th:href="@{/ativos}" class="btn btn-outline-primary w-100 py-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                     class="bi bi-box-seam d-block mx-auto mb-1" viewBox="0 0 16 16">
                    <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                </svg>
                Gerenciar Ativos
            </a>
        </div>
        <div class="col-sm-6 col-md-4">
            <a th:href="@{/categorias}" class="btn btn-outline-info w-100 py-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                     class="bi bi-tags d-block mx-auto mb-1" viewBox="0 0 16 16">
                    <path d="M3 2v4.586l7 7L14.586 9l-7-7zm2 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                    <path d="M1.293 7.793A1 1 0 0 1 1 7.086V2a1 1 0 0 1 1-1h5.086a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0z"/>
                </svg>
                Categorias de Ativos
            </a>
        </div>
        <div class="col-sm-6 col-md-4">
            <a th:href="@{/chamados}" class="btn btn-outline-secondary w-100 py-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                     class="bi bi-ticket-detailed d-block mx-auto mb-1" viewBox="0 0 16 16">
                    <path d="M4 5.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Z"/>
                    <path d="M0 4.5A1.5 1.5 0 0 1 1.5 3h13A1.5 1.5 0 0 1 16 4.5V6a.5.5 0 0 1-.5.5 1.5 1.5 0 0 0 0 3 .5.5 0 0 1 .5.5v1.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 11.5V10a.5.5 0 0 1 .5-.5 1.5 1.5 0 0 0 0-3A.5.5 0 0 1 0 6V4.5ZM1.5 4a.5.5 0 0 0-.5.5v1.05a2.5 2.5 0 0 1 0 4.9v1.05a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-1.05a2.5 2.5 0 0 1 0-4.9V4.5a.5.5 0 0 0-.5-.5h-13Z"/>
                </svg>
                Painel de Chamados
            </a>
        </div>
    </div>

</main>

<!-- Estilo específico do dashboard -->
<style>
    .bg-gradient-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    }
    .bg-gradient-info {
        background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
    }
    .bg-gradient-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .bg-gradient-danger {
        background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }
    .card-dashboard {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-dashboard:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
    }
    .icon-box {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>

</body>
</html>
