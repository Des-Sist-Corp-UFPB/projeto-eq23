<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Ativos</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Ativos</h1>
            <p class="text-muted mb-0">Gerencie o inventário de ativos de TI</p>
        </div>
        <button class="btn btn-primary"
                hx-get="/ativos/novo"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                hx-indicator="#spinner">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
            </svg>
            Novo Ativo
            <span id="spinner" class="spinner-border spinner-border-sm htmx-indicator ms-1"
                  role="status" aria-hidden="true"></span>
        </button>
    </div>

    <!-- Card que envolve a tabela -->
    <div class="card">
        <div class="card-body px-4 py-4">

            <!-- Campo de busca com debounce via HTMX -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                        </span>
                        <input type="search"
                               name="busca"
                               id="campoBusca"
                               class="form-control"
                               placeholder="Buscar por nome..."
                               th:value="${busca}"
                               hx-get="/ativos/fragmento-tabela"
                               hx-trigger="keyup changed delay:400ms, search"
                               hx-target="#tabela-container"
                               hx-swap="innerHTML"
                               hx-include="#filtroCategoria"/>
                    </div>
                </div>
                <div class="col-md-4">
                    <!-- Filtro por categoria via HTMX -->
                    <select id="filtroCategoria"
                            name="categoriaId"
                            class="form-select"
                            hx-get="/ativos/fragmento-tabela"
                            hx-trigger="change"
                            hx-target="#tabela-container"
                            hx-swap="innerHTML"
                            hx-include="#campoBusca">
                        <option value="">Todas as categorias</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nome}"
                                th:selected="${categoriaId != null and categoriaId == cat.id}">
                            Categoria
                        </option>
                    </select>
                </div>
                <div class="col-md-2 text-end d-flex align-items-center justify-content-end">
                    <span class="text-muted small" th:if="${ativos != null}">
                        <span th:text="${ativos.totalElements}">0</span> ativo(s)
                    </span>
                </div>
            </div>

            <div id="tabela-container">
                <th:block th:insert="~{ativos/fragments/tabela :: tabela}"></th:block>
            </div>

        </div>
    </div>

</main>

</body>
</html>
