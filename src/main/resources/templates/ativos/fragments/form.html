<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modal">

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="produtoModal" tabindex="-1"
         aria-labelledby="ativoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <!-- Cabeçalho do modal -->
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="ativoModalLabel">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                             class="bi me-2" viewBox="0 0 16 16"
                             th:classappend="${ativo == null} ? 'bi-plus-circle' : 'bi-pencil-square'">
                            <path th:if="${ativo == null}"
                                  d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path th:if="${ativo == null}"
                                  d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                        </svg>
                        <span th:text="${ativo == null} ? 'Novo Ativo' : 'Editar Ativo'">
                            Ativo
                        </span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <form th:object="${form}"
                      th:attr="
                        hx-post=${ativo == null ? '/ativos' : null},
                        hx-put=${ativo != null ? '/ativos/' + ativo.id : null},
                        hx-target=${ativo == null ? '#lista-ativos' : '#ativo-' + ativo.id},
                        hx-swap=${ativo == null ? 'beforeend' : 'outerHTML'}"
                      hx-on--after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('produtoModal')).hide(); }">

                    <div class="modal-body">

                        <!-- Alertas de erro de validação global -->
                        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Erro</li>
                            </ul>
                        </div>

                        <!-- Campo Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">
                                Nome <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   th:field="*{nome}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   placeholder="Ex.: Servidor Dell PowerEdge R750"
                                   maxlength="120"
                                   required/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nome')}"
                                 th:errors="*{nome}">
                                Erro no nome
                            </div>
                        </div>

                        <!-- Campo Descrição -->
                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">Descrição</label>
                            <textarea th:field="*{descricao}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                      rows="3"
                                      placeholder="Descrição opcional do ativo..."
                                      maxlength="2000"></textarea>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('descricao')}"
                                 th:errors="*{descricao}">
                                Erro na descrição
                            </div>
                        </div>

                        <!-- Campo Número de Série -->
                        <div class="mb-3">
                            <label for="numeroSerie" class="form-label fw-semibold text-light">Número de Série</label>
                            <input type="text"
                                   id="numeroSerie"
                                   th:field="*{numeroSerie}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('numeroSerie')} ? 'is-invalid'"
                                   placeholder="Ex.: Dell-SN9283719"
                                   maxlength="50"/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('numeroSerie')}"
                                 th:errors="*{numeroSerie}">
                                Erro no número de série
                            </div>
                        </div>

                        <!-- Campo Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label fw-semibold text-light">Status <span class="text-danger">*</span></label>
                            <select id="status"
                                    th:field="*{status}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                                    required>
                                <option value="ATIVO">Ativo</option>
                                <option value="EM_MANUTENCAO">Em Manutenção</option>
                                <option value="BAIXADO">Baixado</option>
                            </select>
                        </div>

                        <!-- Seção de Patrimônios -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-light d-flex justify-content-between align-items-center">
                                Patrimônios (Equipamentos Físicos)
                                <button type="button" class="btn btn-sm btn-success" id="btn-add-patrimonio">
                                    + Adicionar Equipamento
                                </button>
                            </label>
                            
                            <div id="patrimonio-list" class="border border-secondary rounded p-2 bg-dark-subtle">
                                <!-- Patrimônios Existentes -->
                                <div th:each="pat, iter : *{patrimonios}" class="row g-2 mb-2 align-items-center patrimonio-row">
                                    <div class="col-sm-5">
                                        <input type="text" th:name="'patrimonios[' + ${iter.index} + '].codigo'" th:value="${pat.codigo}" class="form-control form-control-sm" placeholder="Código (Ex: PAT-001)" required/>
                                    </div>
                                    <div class="col-sm-5">
                                        <input type="text" th:name="'patrimonios[' + ${iter.index} + '].numeroSerie'" th:value="${pat.numeroSerie}" class="form-control form-control-sm" placeholder="Nº de Série" required/>
                                    </div>
                                    <div class="col-sm-2 text-end">
                                        <button type="button" class="btn btn-sm btn-danger btn-remove-patrimonio">Remover</button>
                                    </div>
                                </div>
                                
                                <div id="no-patrimonio-msg" class="text-muted text-center py-2 small" th:style="${form.patrimonios != null and !form.patrimonios.empty} ? 'display: none;' : ''">
                                    Nenhum patrimônio cadastrado para este ativo.
                                </div>
                            </div>
                        </div>

                        <script th:inline="javascript">
                            (function() {
                                const list = document.getElementById('patrimonio-list');
                                const btnAdd = document.getElementById('btn-add-patrimonio');
                                const msg = document.getElementById('no-patrimonio-msg');
                                
                                function updateIndices() {
                                    const rows = list.querySelectorAll('.patrimonio-row');
                                    rows.forEach((row, idx) => {
                                        const inputs = row.querySelectorAll('input');
                                        inputs[0].name = `patrimonios[${idx}].codigo`;
                                        inputs[1].name = `patrimonios[${idx}].numeroSerie`;
                                    });
                                    if (rows.length === 0) {
                                        msg.style.display = 'block';
                                    } else {
                                        msg.style.display = 'none';
                                    }
                                }

                                btnAdd.addEventListener('click', function() {
                                    const idx = list.querySelectorAll('.patrimonio-row').length;
                                    const div = document.createElement('div');
                                    div.className = 'row g-2 mb-2 align-items-center patrimonio-row';
                                    div.innerHTML = `
                                        <div class="col-sm-5">
                                            <input type="text" name="patrimonios[${idx}].codigo" class="form-control form-control-sm" placeholder="Código (Ex: PAT-001)" required />
                                        </div>
                                        <div class="col-sm-5">
                                            <input type="text" name="patrimonios[${idx}].numeroSerie" class="form-control form-control-sm" placeholder="Nº de Série" required />
                                        </div>
                                        <div class="col-sm-2 text-end">
                                            <button type="button" class="btn btn-sm btn-danger btn-remove-patrimonio">Remover</button>
                                        </div>
                                    `;
                                    list.appendChild(div);
                                    msg.style.display = 'none';
                                    
                                    div.querySelector('.btn-remove-patrimonio').addEventListener('click', function() {
                                        div.remove();
                                        updateIndices();
                                    });
                                });

                                list.querySelectorAll('.btn-remove-patrimonio').forEach(btn => {
                                    btn.addEventListener('click', function() {
                                        btn.closest('.patrimonio-row').remove();
                                        updateIndices();
                                    });
                                });
                            })();
                        </script>

                        <!-- Informações do ativo em modo edição -->
                        <div th:if="${ativo != null}" class="alert alert-light border small">
                            <div class="row">
                                <div class="col-sm-6">
                                    <strong>Criado em:</strong>
                                    <span th:text="${#temporals.format(ativo.criadoEm.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'dd/MM/yyyy HH:mm')}">
                                        00/00/0000
                                    </span>
                                </div>
                                <div class="col-sm-6">
                                    <strong>Atualizado em:</strong>
                                    <span th:text="${#temporals.format(ativo.atualizadoEm.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'dd/MM/yyyy HH:mm')}">
                                        00/00/0000
                                    </span>
                                </div>
                            </div>
                        </div>

                    </div><!-- /modal-body -->

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" class="bi bi-check-lg me-1" viewBox="0 0 16 16">
                                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
                            </svg>
                            <span th:text="${ativo == null} ? 'Salvar Ativo' : 'Atualizar Ativo'">
                                Salvar
                            </span>
                            <span class="spinner-border spinner-border-sm htmx-indicator ms-1"
                                  role="status" aria-hidden="true"></span>
                        </button>
                    </div>

                </form>

            </div><!-- /modal-content -->
        </div><!-- /modal-dialog -->
    </div><!-- /modal -->

</th:block>

</body>
</html>
