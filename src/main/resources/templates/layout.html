<!DOCTYPE html>
<!--
  Layout base da aplicação — todas as páginas estendem este template.

  Thymeleaf Layout:
  - th:fragment="layout(content)" define que esta página é um layout reutilizável.
  - As páginas filhas usam th:replace="~{layout :: layout(~{::main})}" para herdar este layout.
  - O conteúdo específico de cada página é injetado onde aparece th:replace="${content}".

  Webjars:
  - Bootstrap e HTMX são servidos pelo Spring como recursos estáticos via /webjars/**
  - O webjars-locator-core resolve automaticamente a versão correta nas URLs
-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- CSRF Token Meta Tags -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${titulo != null ? titulo + ' — SparkTech' : 'SparkTech'}">SparkTech</title>

    <!-- Umami Analytics -->
    <script async
            th:if="${umamiWebsiteId != null and !umamiWebsiteId.isBlank()}"
            th:src="${umamiScriptUrl}"
            th:data-website-id="${umamiWebsiteId}"></script>


    <!--
      Bootstrap CSS via WebJars.
      O webjars-locator-core permite omitir a versão na URL — o Spring a resolve automaticamente.
      Sem o locator, precisaríamos: /webjars/bootstrap/5.3.3/css/bootstrap.min.css
    -->
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>

    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilo customizado minimalista premium (Tema Escuro Glassmorphism) -->
    <style>
        :root {
            --bs-font-sans-serif: 'Inter', system-ui, -apple-system, sans-serif;
            --font-title: 'Outfit', system-ui, -apple-system, sans-serif;
            --bs-body-bg: #090d16;
            --bs-body-color: #f1f5f9;
            --bs-primary: #6366f1;
            --bs-primary-hover: #4f46e5;
            --bs-border-color: rgba(255, 255, 255, 0.08);
            --bs-border-radius: 1rem;
            --custom-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.15), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --glass-bg: rgba(17, 24, 39, 0.55);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        
        body {
            font-family: var(--bs-font-sans-serif);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 100%);
            background-attachment: fixed;
        }

        h1, h2, h3, h4, h5, h6, .sidebar-brand {
            font-family: var(--font-title);
            color: #ffffff;
        }

        .text-muted {
            color: #94a3b8 !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .sidebar {
            width: 270px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--bs-border-color);
            z-index: 1040;
            padding: 2.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            margin-left: 270px;
            padding: 2.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.03em;
            color: #ffffff !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
            transition: transform 0.2s ease;
        }

        .sidebar-brand:hover {
            transform: scale(1.02);
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .sidebar .nav-item {
            margin-bottom: 0.35rem;
        }
        
        .sidebar .nav-link {
            font-weight: 500;
            color: #94a3b8 !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
        }
        
        .sidebar .nav-link svg {
            transition: transform 0.25s ease;
        }

        .sidebar .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .sidebar .nav-link:hover svg {
            transform: scale(1.15);
        }
        
        .sidebar .nav-link.active {
            color: #ffffff !important;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.1);
        }

        .sidebar .nav-link.active:hover {
            transform: none;
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid var(--bs-border-color);
            padding-top: 1.25rem;
        }

        .card {
            border: 1px solid var(--bs-border-color);
            box-shadow: var(--custom-shadow);
            border-radius: var(--bs-border-radius);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .table {
            color: #e2e8f0;
        }

        .table-light {
            background-color: rgba(255, 255, 255, 0.02) !important;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .table-light th {
            background-color: transparent !important;
            color: #ffffff !important;
        }

        .table-hover tbody tr {
            transition: background-color 0.2s ease, transform 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-hover tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03) !important;
        }

        .dropdown-menu {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .dropdown-item {
            color: #cbd5e1;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
        
        .btn {
            border-radius: 0.75rem;
            font-weight: 600;
            padding: 0.55rem 1.25rem;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            font-size: 0.92rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-outline-primary {
            border-color: rgba(99, 102, 241, 0.4);
            color: #818cf8;
        }

        .btn-outline-primary:hover {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border-color: transparent;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-outline-secondary {
            border-color: rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
        }

        .btn-outline-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        /* Estilização de modais em modo escuro */
        .modal-content {
            background-color: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, #1e1b4b 0%, #111827 100%) !important;
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Estilização refinada de formulários */
        .form-control, .form-select {
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
            background-color: rgba(15, 23, 42, 0.6);
            color: #ffffff;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.8);
            color: #ffffff;
        }

        .input-group-text {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
        }

        /* Paginação */
        .page-link {
            background-color: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .page-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border-color: transparent;
            color: #ffffff;
        }

        .page-item.disabled .page-link {
            background-color: rgba(15, 23, 42, 0.2);
            border-color: rgba(255, 255, 255, 0.05);
            color: #475569;
        }

        /* Transições Fluidas de Entrada para o HTMX */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .htmx-settling tr, #tabela-container > *, .modal-content {
            animation: slideUpFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Indicador de carregamento HTMX */
        .htmx-indicator {
            display: none;
            transition: opacity 0.25s ease;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        /* Toast container */
        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1100;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <!-- Marca / Logo -->
    <a class="sidebar-brand" th:href="@{/ativos}">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#6366f1"
             class="bi bi-lightning-charge-fill me-2" viewBox="0 0 16 16">
            <path d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z"/>
        </svg>
        SparkTech
    </a>

    <!-- Links de navegação -->
    <ul class="sidebar-nav">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI == '/'} ? 'active'"
               th:href="@{/}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-house me-2" viewBox="0 0 16 16">
                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                </svg>
                Dashboard
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/ativos')} ? 'active'"
               th:href="@{/ativos}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-box-seam me-2" viewBox="0 0 16 16">
                    <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                </svg>
                Ativos
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/chamados') and requestURI != '/chamados/abrir'} ? 'active'"
               th:href="@{/chamados}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-ticket-detailed me-2" viewBox="0 0 16 16">
                    <path d="M4 5.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Zm0 2a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5Z"/>
                    <path d="M0 4.5A1.5 1.5 0 0 1 1.5 3h13A1.5 1.5 0 0 1 16 4.5V6a.5.5 0 0 1-.5.5 1.5 1.5 0 0 0 0 3 .5.5 0 0 1 .5.5v1.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 11.5V10a.5.5 0 0 1 .5-.5 1.5 1.5 0 0 0 0-3A.5.5 0 0 1 0 6V4.5ZM1.5 4a.5.5 0 0 0-.5.5v1.05a2.5 2.5 0 0 1 0 4.9v1.05a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-1.05a2.5 2.5 0 0 1 0-4.9V4.5a.5.5 0 0 0-.5-.5h-13Z"/>
                </svg>
                Chamados
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI == '/chamados/abrir'} ? 'active'"
               th:href="@{/chamados/abrir}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-plus-circle me-2" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                </svg>
                Solicitar Suporte
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/auditoria')} ? 'active'"
               th:href="@{/auditoria}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-journal-text me-2" viewBox="0 0 16 16">
                    <path d="M5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/>
                    <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3z"/>
                </svg>
                Auditoria
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a class="nav-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/admin/usuarios')} ? 'active'"
               th:href="@{/admin/usuarios}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-people me-2" viewBox="0 0 16 16">
                    <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zm3.487-6.472A4 4 0 1 0 5 4a4 4 0 0 0 5.5 3.528M7 5a1 1 0 1 1 2 0 1 1 0 0 1-2 0"/>
                    <path d="M5.216 14A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1z"/>
                    <path d="M4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                </svg>
                Usuários
            </a>
        </li>
    </ul>

    <!-- Área do usuário logado (rodapé da sidebar) -->
    <div class="sidebar-bottom" sec:authorize="isAuthenticated()">
        <div class="dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     fill="currentColor" class="bi bi-person-circle me-2" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
                <span sec:authentication="name" class="fw-semibold text-light">Usuário</span>
            </a>
            <ul class="dropdown-menu w-100 shadow-sm border-0">
                <li>
                    <a class="dropdown-item d-flex align-items-center" th:href="@{/perfil}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                             fill="currentColor" class="bi bi-person-gear me-2" viewBox="0 0 16 16">
                            <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                            <path d="M2 13c0 1 1 1 1 1h4.083A6.5 6.5 0 0 1 7 12.5c0-.335.025-.664.073-.986C6.66 11.171 6.13 11 5.5 11c-3 0-5 1.678-5 3s1 1 1 1z"/>
                            <path fill-rule="evenodd" d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0M9.5 9a.5.5 0 0 1 .5.5v.514a2.5 2.5 0 0 1 .802.328l.363-.363a.5.5 0 1 1 .707.707l-.363.363c.155.243.267.514.328.802h.514a.5.5 0 0 1 0 1h-.514a2.5 2.5 0 0 1-.328.802l.363.363a.5.5 0 0 1-.707.707l-.363-.363a2.5 2.5 0 0 1-.802.328v.514a.5.5 0 0 1-1 0v-.514a2.5 2.5 0 0 1-.802-.328l-.363.363a.5.5 0 0 1-.707-.707l.363-.363a2.5 2.5 0 0 1-.328-.802h-.514a.5.5 0 0 1 0-1h.514c.061-.288.173-.559.328-.802l-.363-.363a.5.5 0 0 1 .707-.707l.363.363c.243-.155.514-.267.802-.328V9.5a.5.5 0 0 1 .5-.5"/>
                        </svg>
                        Meu Perfil
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="dropdown-item text-danger d-flex align-items-center">

<!-- ============================================================
     SCRIPTS — ao final do body para não bloquear o carregamento
     ============================================================ -->

<!--
  Bootstrap JS (Bundle com Popper.js incluído) via WebJars.
  Necessário para: modais, dropdowns, collapse (navbar mobile), etc.
-->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!--
  HTMX via WebJars.
  HTMX adiciona comportamento AJAX a elementos HTML via atributos hx-*.
  Sem escrever nenhum JavaScript, você consegue:
  - hx-get, hx-post, hx-put, hx-delete: fazer requisições HTTP
  - hx-target: onde inserir a resposta
  - hx-swap: como substituir o conteúdo (innerHTML, outerHTML, beforeend, etc.)
  - hx-trigger: quando disparar a requisição (click, keyup, etc.)
-->
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>

<!--
  Container do modal — usado pelo HTMX para injetar o modal de formulário.
  O HTMX carrega o HTML do modal aqui e, após injetar, o Bootstrap o exibe.
-->
<div id="modal-container"></div>

<!--
  Container de Toasts — fixo no canto inferior direito.
  Os toasts são criados dinamicamente pelo JavaScript abaixo
  quando o HTMX recebe o header HX-Trigger na resposta.
-->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!--
  Script para abrir o modal automaticamente após o HTMX injectá-lo no DOM.
  htmx:afterSwap é disparado após o HTMX substituir o conteúdo.
-->
<script th:inline="javascript">
    // Configura o HTMX para incluir o token CSRF em todas as requisições AJAX
    document.body.addEventListener('htmx:configRequest', function(evt) {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
        if (csrfToken && csrfHeader) {
            evt.detail.headers[csrfHeader] = csrfToken;
        }
    });

    // Exibe toast ao carregar a página se houver mensagem no model (ex: após redirecionamento)
    document.addEventListener('DOMContentLoaded', function() {
        const msg = /*[[${toastMensagem}]]*/ null;
        if (msg) {
            mostrarToast(msg, 'success');
        }
    });

    // Abre o modal Bootstrap após o HTMX injetar o HTML no #modal-container
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'modal-container') {
            const modalEl = document.getElementById('produtoModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }
    });

    /**
     * Exibe um Toast Bootstrap com a mensagem informada.
     * Criado dinamicamente e auto-removido após fechar.
     *
     * @param {string} mensagem - Texto a exibir no toast
     * @param {string} tipo - Classe Bootstrap: 'success', 'danger', 'warning', 'info'
     */
    function mostrarToast(mensagem, tipo) {
        tipo = tipo || 'success';
        const container = document.getElementById('toast-container');
        const id = 'toast-' + Date.now();
        const html = `
            <div id="${id}" class="toast align-items-center text-white bg-${tipo} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3500">
                <div class="d-flex">
                    <div class="toast-body fw-semibold">
                        ${mensagem}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(id);
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
        // Remove o elemento do DOM após ser ocultado
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // Escuta respostas HTMX bem-sucedidas e verifica o header HX-Trigger
    // O controller adiciona "toastMensagem" no model, que o Thymeleaf renderiza
    // como um atributo de dados no fragmento retornado
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        // Verifica se o HTMX recebeu o header de trigger customizado
        const trigger = evt.detail.xhr.getResponseHeader('HX-Trigger');
        if (trigger) {
            try {
                const data = JSON.parse(trigger);
                if (data.showToast) {
                    mostrarToast(data.showToast, data.toastType || 'success');
                }
            } catch(e) {
                // header simples (string), não JSON
            }
        }
    });
</script>

</body>
</html>
