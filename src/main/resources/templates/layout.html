<!DOCTYPE html>
<!--
  Layout base da aplicação — todas as páginas estendem este template.

  Thymeleaf Layout:
  - th:fragment="layout(content)" define que esta página é um layout reutilizável.
  - As páginas filhas usam th:replace="~{layout :: layout(~{::main})}" para herdar este layout.
  - O conteúdo específico de cada página é injetado onde aparece th:replace="${content}".

  Webjars:
  - Bootstrap e HTMX são servidos pelo Spring como recursos estáticos via /webjars/**
  - O webjars-locator-core resolve automaticamente a versão correta nas URLs
-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo != null ? titulo + ' — SparkTech' : 'SparkTech'}">SparkTech</title>

    <!--
      Bootstrap CSS via WebJars.
      O webjars-locator-core permite omitir a versão na URL — o Spring a resolve automaticamente.
      Sem o locator, precisaríamos: /webjars/bootstrap/5.3.3/css/bootstrap.min.css
    -->
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>

    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilo customizado minimalista -->
    <style>
        :root {
            --bs-font-sans-serif: 'Inter', system-ui, -apple-system, sans-serif;
            --bs-body-bg: #f9fafb;
            --bs-body-color: #374151;
            --bs-primary: #2563eb;
            --bs-border-color: #f3f4f6;
            --bs-border-radius: 0.75rem;
            --custom-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        body {
            font-family: var(--bs-font-sans-serif);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.9) !important;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #1e293b !important;
        }
        
        .nav-link {
            font-weight: 500;
            color: #64748b !important;
            transition: color 0.15s ease;
        }
        
        .nav-link:hover, .nav-link.active {
            color: #1e293b !important;
        }

        .card {
            border: none;
            box-shadow: var(--custom-shadow);
            border-radius: var(--bs-border-radius);
            background-color: #ffffff;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f5f9;
        }
        
        .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        /* Indicador de carregamento HTMX */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        /* Toast container */
        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1100;
        }
    </style>
</head>
<body>

<!-- ============================================================
     NAVBAR — Barra de navegação principal
     ============================================================ -->
<nav class="navbar navbar-expand-lg sticky-top mb-5">
    <div class="container">
        <!-- Marca / Logo -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/produtos}">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#2563eb"
                 class="bi bi-lightning-charge-fill me-2" viewBox="0 0 16 16">
                <path d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z"/>
            </svg>
            SparkTech
        </a>

        <!-- Botão hamburger para mobile -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links de navegação -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${requestURI != null and requestURI == '/'} ? 'active'"
                       th:href="@{/}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                             class="bi bi-house me-1" viewBox="0 0 16 16">
                            <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                        </svg>
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <!--
                      th:classappend adiciona a classe "active" dinamicamente se a URL atual
                      começa com /produtos — indica visualmente a página atual.
                    -->
                    <a class="nav-link"
                       th:classappend="${requestURI != null and requestURI.startsWith('/produtos')} ? 'active'"
                       th:href="@{/produtos}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                             class="bi bi-box-seam me-1" viewBox="0 0 16 16">
                            <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                        </svg>
                        Produtos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${requestURI != null and requestURI.startsWith('/categorias')} ? 'active'"
                       th:href="@{/categorias}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                             class="bi bi-tags me-1" viewBox="0 0 16 16">
                            <path d="M3 2v4.586l7 7L14.586 9l-7-7zm2 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                            <path d="M1.293 7.793A1 1 0 0 1 1 7.086V2a1 1 0 0 1 1-1h5.086a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0z"/>
                        </svg>
                        Categorias
                    </a>
                </li>
            </ul>

            <!-- Área do usuário logado (direita da navbar) -->
            <ul class="navbar-nav">
                <!--
                  sec:authorize="isAuthenticated()" — dialeto do Thymeleaf Security.
                  Este bloco só é renderizado se o usuário estiver autenticado.
                  Requer a dependência: thymeleaf-extras-springsecurity6
                -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                             fill="currentColor" class="bi bi-person-circle me-1" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                        </svg>
                        <!--
                          sec:authentication="name" exibe o username do usuário autenticado.
                          Outros valores disponíveis: principal, authorities, details
                        -->
                        <span sec:authentication="name">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <!--
                              Formulário de logout — POST é obrigatório pelo Spring Security (proteção CSRF).
                              O Spring Security intercepta POST /logout e invalida a sessão.
                            -->
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                         fill="currentColor" class="bi bi-box-arrow-right me-1" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                                    </svg>
                                    Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============================================================
     CONTEÚDO PRINCIPAL — injetado pelas páginas filhas
     ============================================================ -->
<main class="container">
    <!--
      th:replace="${content}" injeta o conteúdo específico de cada página.
      O Thymeleaf substitui este elemento pelo bloco <main> da página filha.
    -->
    <th:block th:replace="${content}">
        <!-- Conteúdo padrão (não deve aparecer se usado corretamente) -->
    </th:block>
</main>

<!-- ============================================================
     RODAPÉ
     ============================================================ -->
<footer class="mt-5 py-4 border-top" style="background-color: transparent;">
    <div class="container text-center text-muted small">
        <p class="mb-0">
            DSC — Desenvolvimento de Sistemas Corporativos |
            Prof. Rodrigo Rebouças | UFPB Campus IV
        </p>
    </div>
</footer>

<!-- ============================================================
     SCRIPTS — ao final do body para não bloquear o carregamento
     ============================================================ -->

<!--
  Bootstrap JS (Bundle com Popper.js incluído) via WebJars.
  Necessário para: modais, dropdowns, collapse (navbar mobile), etc.
-->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!--
  HTMX via WebJars.
  HTMX adiciona comportamento AJAX a elementos HTML via atributos hx-*.
  Sem escrever nenhum JavaScript, você consegue:
  - hx-get, hx-post, hx-put, hx-delete: fazer requisições HTTP
  - hx-target: onde inserir a resposta
  - hx-swap: como substituir o conteúdo (innerHTML, outerHTML, beforeend, etc.)
  - hx-trigger: quando disparar a requisição (click, keyup, etc.)
-->
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>

<!--
  Container do modal — usado pelo HTMX para injetar o modal de formulário.
  O HTMX carrega o HTML do modal aqui e, após injetar, o Bootstrap o exibe.
-->
<div id="modal-container"></div>

<!--
  Container de Toasts — fixo no canto inferior direito.
  Os toasts são criados dinamicamente pelo JavaScript abaixo
  quando o HTMX recebe o header HX-Trigger na resposta.
-->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!--
  Script para abrir o modal automaticamente após o HTMX injectá-lo no DOM.
  htmx:afterSwap é disparado após o HTMX substituir o conteúdo.
-->
<script>
    // Abre o modal Bootstrap após o HTMX injetar o HTML no #modal-container
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'modal-container') {
            const modalEl = document.getElementById('produtoModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }
    });

    /**
     * Exibe um Toast Bootstrap com a mensagem informada.
     * Criado dinamicamente e auto-removido após fechar.
     *
     * @param {string} mensagem - Texto a exibir no toast
     * @param {string} tipo - Classe Bootstrap: 'success', 'danger', 'warning', 'info'
     */
    function mostrarToast(mensagem, tipo) {
        tipo = tipo || 'success';
        const container = document.getElementById('toast-container');
        const id = 'toast-' + Date.now();
        const html = `
            <div id="${id}" class="toast align-items-center text-white bg-${tipo} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3500">
                <div class="d-flex">
                    <div class="toast-body fw-semibold">
                        ${mensagem}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(id);
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
        // Remove o elemento do DOM após ser ocultado
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // Escuta respostas HTMX bem-sucedidas e verifica o header HX-Trigger
    // O controller adiciona "toastMensagem" no model, que o Thymeleaf renderiza
    // como um atributo de dados no fragmento retornado
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        // Verifica se o HTMX recebeu o header de trigger customizado
        const trigger = evt.detail.xhr.getResponseHeader('HX-Trigger');
        if (trigger) {
            try {
                const data = JSON.parse(trigger);
                if (data.showToast) {
                    mostrarToast(data.showToast, data.toastType || 'success');
                }
            } catch(e) {
                // header simples (string), não JSON
            }
        }
    });
</script>

</body>
</html>
