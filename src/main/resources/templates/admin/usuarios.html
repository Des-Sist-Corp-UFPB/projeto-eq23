<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Usuários</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Usuários</h1>
            <p class="text-muted mb-0">Gerencie o papel (ADMIN / TÉCNICO / CLIENTE) de cada usuário</p>
        </div>
    </div>

    <!-- Card da tabela -->
    <div class="card">
        <div class="card-body px-4 py-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuário (e-mail/login)</th>
                        <th>Papel atual</th>
                        <th>Alterar papel</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nome}">Nome</td>
                        <td th:text="${usuario.username}">usuario@exemplo.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${usuario.role}">CLIENTE</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/usuarios/{id}/role(id=${usuario.id})}" method="post"
                                  class="d-flex gap-2">
                                <select name="role" class="form-select form-select-sm" style="max-width: 160px;">
                                    <option th:each="papel : ${papeis}"
                                            th:value="${papel}"
                                            th:selected="${papel == usuario.role}"
                                            th:text="${papel}">CLIENTE</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-muted py-4">Nenhum usuário cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

</body>
</html>
