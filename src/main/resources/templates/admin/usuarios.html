<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Usuários</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Usuários</h1>
            <p class="text-muted mb-0">Gerencie o papel de cada usuário (ADMIN_SISTEMA / ADMIN / TÉCNICO / CLIENTE)</p>
        </div>
        <a th:if="${not #lists.isEmpty(papeis)}" th:href="@{/admin/usuarios/novo}" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-plus me-1" viewBox="0 0 16 16">
                <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-5a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H1s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C9.516 10.68 8.289 10 6 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                <path d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"/>
            </svg>
            Criar usuário
        </a>
    </div>

    <!-- Card da tabela -->
    <div class="card">
        <div class="card-body px-4 py-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuário (e-mail/login)</th>
                        <th>Papel atual</th>
                        <th>Alterar papel</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nome}">Nome</td>
                        <td th:text="${usuario.username}">usuario@exemplo.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${usuario.role}">CLIENTE</span>
                        </td>
                        <td>
                            <form th:if="${#lists.contains(papeis, usuario.role)}"
                                  th:action="@{/admin/usuarios/{id}/role(id=${usuario.id})}" method="post"
                                  class="d-flex gap-2">
                                <select name="role" class="form-select form-select-sm" style="max-width: 160px;">
                                    <option th:each="papel : ${papeis}"
                                            th:value="${papel}"
                                            th:selected="${papel == usuario.role}"
                                            th:text="${papel}">CLIENTE</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                            </form>
                            <span th:unless="${#lists.contains(papeis, usuario.role)}" class="text-muted small">
                                Sem permissão pra alterar
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-muted py-4">Nenhum usuário cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

</body>
</html>
