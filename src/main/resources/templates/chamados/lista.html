<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Chamados</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" sec:authorize="hasAnyRole('ADMIN', 'TECNICO')">Chamados de Suporte (Geral)</h1>
            <h1 class="h3 mb-1" sec:authorize="!hasAnyRole('ADMIN', 'TECNICO')">Meus Chamados de Suporte</h1>
            <p class="text-muted mb-0" sec:authorize="hasAnyRole('ADMIN', 'TECNICO')">Gerencie e solucione os chamados de TI do sistema</p>
            <p class="text-muted mb-0" sec:authorize="!hasAnyRole('ADMIN', 'TECNICO')">Acompanhe o histórico, status e especificações dos chamados abertos por você</p>
        </div>
        <button class="btn btn-primary"
                hx-get="/chamados/novo"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                hx-indicator="#spinner">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
            </svg>
            Abrir Chamado
            <span id="spinner" class="spinner-border spinner-border-sm htmx-indicator ms-1"
                  role="status" aria-hidden="true"></span>
        </button>
    </div>

    <!-- Abas de Filtro de Chamados -->
    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link px-3 py-2 fw-semibold me-2"
               th:classappend="${statusFiltro == null or statusFiltro == ''} ? 'active bg-primary text-white' : 'text-light bg-dark bg-opacity-50'"
               th:href="@{/chamados}"
               hx-get="/chamados"
               hx-target="#tabela-container"
               hx-push-url="true">
               Todos os Chamados
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link px-3 py-2 fw-semibold"
               th:classappend="${statusFiltro == 'RESOLVIDO'} ? 'active bg-success text-white' : 'text-light bg-dark bg-opacity-50'"
               th:href="@{/chamados(status='RESOLVIDO')}"
               hx-get="/chamados?status=RESOLVIDO"
               hx-target="#tabela-container"
               hx-push-url="true">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill me-1" viewBox="0 0 16 16">
                   <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
               </svg>
               Chamados Resolvidos
            </a>
        </li>
    </ul>

    <!-- Card da tabela -->
    <div class="card">
        <div class="card-body px-4 py-4">
            
            <div id="tabela-container">
                <th:block th:insert="~{chamados/fragments/tabela :: tabela}"></th:block>
            </div>

        </div>
    </div>

</main>

</body>
</html>
