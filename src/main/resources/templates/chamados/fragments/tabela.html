<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="tabela">

    <div class="table-responsive">
        <table class="table table-hover table-borderless align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 4%">#</th>
                    <th scope="col" style="width: 25%">Título / Ativo</th>
                    <th scope="col" style="width: 15%">Cliente</th>
                    <th scope="col" style="width: 15%">Técnico</th>
                    <th scope="col" style="width: 12%">Prioridade</th>
                    <th scope="col" style="width: 12%" class="text-center">Status</th>
                    <th scope="col" style="width: 10%" class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody id="lista-chamados">
                <th:block th:each="chamado : ${chamados.content}"
                          th:insert="~{chamados/fragments/linha :: linha(chamado=${chamado})}">
                </th:block>

                <!-- Mensagem quando não há chamados -->
                <tr th:if="${chamados == null or chamados.content.empty}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                             fill="currentColor" class="bi bi-inbox d-block mx-auto mb-2 text-secondary"
                             viewBox="0 0 16 16">
                            <path d="M4.98 4a.5.5 0 0 0-.39.188L1.54 8H6a.5.5 0 0 1 .5.5 1.5 1.5 0 1 0 3 0A.5.5 0 0 1 10 8h4.46l-3.05-3.812A.5.5 0 0 0 11.02 4zm-1.17-.437A1.5 1.5 0 0 1 4.98 3h6.04a1.5 1.5 0 0 1 1.17.563l3.7 4.625a.5.5 0 0 1 .106.374l-.39 3.124A1.5 1.5 0 0 1 14.117 13H1.883a1.5 1.5 0 0 1-1.489-1.314l-.39-3.124a.5.5 0 0 1 .106-.374z"/>
                        </svg>
                        Nenhum chamado encontrado.
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <!-- Paginação -->
    <nav th:if="${chamados != null and chamados.totalPages > 1}"
         aria-label="Paginação de chamados" class="mt-3">
         <ul class="pagination pagination-sm justify-content-center mb-0">

            <li class="page-item" th:classappend="${chamados.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/chamados(pagina=${paginaAtual - 1})}"
                   aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, chamados.totalPages - 1)}"
                class="page-item"
                th:classappend="${i == paginaAtual} ? 'active'">
                <a class="page-link"
                   th:href="@{/chamados(pagina=${i})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${chamados.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/chamados(pagina=${paginaAtual + 1})}"
                   aria-label="Próximo">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
        <p class="text-center text-muted small mt-1">
            Página <span th:text="${paginaAtual + 1}">1</span>
            de <span th:text="${chamados.totalPages}">1</span>
            — <span th:text="${chamados.totalElements}">0</span> chamado(s) no total
        </p>
    </nav>

</th:block>

</body>
</html>
