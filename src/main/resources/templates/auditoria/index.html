<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Log de Auditoria</title>
</head>
<body>

<main>
    <!-- Cabeçalho da página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Log de Auditoria</h1>
            <p class="text-muted mb-0">Rastreabilidade completa de ações e alterações do sistema</p>
        </div>
    </div>

    <!-- Card que envolve a tabela -->
    <div class="card">
        <div class="card-body px-4 py-4">

            <div id="tabela-container">
                <th:block th:insert="~{auditoria/fragments/tabela :: tabela}"></th:block>
            </div>

        </div>
    </div>

</main>

</body>
</html>
