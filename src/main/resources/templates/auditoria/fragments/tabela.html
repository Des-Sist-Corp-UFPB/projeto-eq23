<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="tabela">

    <!-- Tabela responsiva Bootstrap -->
    <div class="table-responsive">
        <table class="table table-hover table-borderless align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 15%">Data / Hora</th>
                    <th scope="col" style="width: 15%">Usuário</th>
                    <th scope="col" style="width: 12%">Ação</th>
                    <th scope="col" style="width: 15%">Entidade</th>
                    <th scope="col" style="width: 10%">ID Reg.</th>
                    <th scope="col" style="width: 33%">Detalhes</th>
                </tr>
            </thead>
            <tbody id="lista-logs">
                <tr th:each="log : ${logs.content}">
                    <td class="text-light fw-medium">
                        <span th:text="${#temporals.format(log.dataHora.atZone(T(java.time.ZoneId).of('America/Recife')), 'dd/MM/yyyy HH:mm:ss')}">23/06/2026 17:00:00</span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="avatar-sm me-2 rounded-circle bg-secondary d-flex align-items-center justify-content-center text-light fw-bold" 
                                 style="width: 28px; height: 28px; font-size: 0.8rem; background-color: rgba(255,255,255,0.1) !important;"
                                 th:text="${#strings.substring(log.usuario, 0, 1).toUpperCase()}">U</div>
                            <span class="text-danger fw-medium" th:text="${log.usuario}">usuario</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge rounded-pill px-2.5 py-1.5 text-uppercase fw-semibold"
                              th:classappend="${
                                log.acao == 'CRIAR' ? 'bg-success-subtle text-success' :
                                (log.acao == 'ATUALIZAR' ? 'bg-info-subtle text-info' :
                                (log.acao == 'EXCLUIR' ? 'bg-danger-subtle text-danger' :
                                'bg-warning-subtle text-warning'))
                              }"
                              th:text="${log.acao}">CRIAR</span>
                    </td>
                    <td>
                        <span class="text-light font-monospace" th:text="${log.entidade}">Ativo</span>
                    </td>
                    <td>
                        <span class="badge bg-dark border border-secondary text-secondary" th:text="${log.entidadeId}">123</span>
                    </td>
                    <td class="text-muted" th:text="${log.detalhes}">Detalhes da alteração realizada</td>
                </tr>

                <!-- Mensagem quando não há logs -->
                <tr th:if="${logs == null or logs.content.empty}">
                    <td colspan="6" class="text-center text-muted py-5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                             fill="currentColor" class="bi bi-clock-history d-block mx-auto mb-2 text-secondary"
                             viewBox="0 0 16 16">
                            <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976c.383.086.76.2 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69c.27.285.52.59.747.91l-.818.576zm.744 1.352a7 7 0 0 0-.346-.438l.61-.787a8 8 0 0 1 .632.748l-.896.477zm.744 2.004a7 7 0 0 0-.106-.398l.96-.282a8 8 0 0 1 .158.746l-.974-.116zM0 8c0-4.41 3.59-8 8-8v1a7 7 0 0 0-7 7z"/>
                            <path d="M8 4.5a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1H8a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5z"/>
                        </svg>
                        Nenhum registro de auditoria encontrado.
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <!-- Paginação -->
    <nav th:if="${logs != null and logs.totalPages > 1}"
         aria-label="Paginação de logs" class="mt-3">
         <ul class="pagination pagination-sm justify-content-center mb-0">

            <li class="page-item" th:classappend="${logs.first} ? 'disabled'">
                <a class="page-link"
                   hx-get=""
                   th:attr="hx-get=@{/auditoria/fragmento-tabela(pagina=${paginaAtual - 1})}"
                   hx-target="#tabela-container"
                   hx-swap="innerHTML"
                   style="cursor: pointer;"
                   aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
                class="page-item"
                th:classappend="${i == paginaAtual} ? 'active'">
                <a class="page-link"
                   hx-get=""
                   th:attr="hx-get=@{/auditoria/fragmento-tabela(pagina=${i})}"
                   hx-target="#tabela-container"
                   hx-swap="innerHTML"
                   style="cursor: pointer;"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${logs.last} ? 'disabled'">
                <a class="page-link"
                   hx-get=""
                   th:attr="hx-get=@{/auditoria/fragmento-tabela(pagina=${paginaAtual + 1})}"
                   hx-target="#tabela-container"
                   hx-swap="innerHTML"
                   style="cursor: pointer;"
                   aria-label="Próximo">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

         </ul>
         <p class="text-center text-muted small mt-1">
             Página <span th:text="${paginaAtual + 1}">1</span>
             de <span th:text="${logs.totalPages}">1</span>
             — <span th:text="${logs.totalElements}">0</span> registro(s) no total
         </p>
    </nav>

</th:block>

</body>
</html>
